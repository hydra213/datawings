name: datawings
version: "0.1.0"
profile: datawings

# no telemetry to dbt Labs from a project holding internal data
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]


models:
  datawings:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +materialized: ephemeral
    marts:
      +schema: marts
      +materialized: table

seeds:
  datawings:
    +schema: ref



name: datawings
version: "0.1.0"
profile: datawings

# no telemetry to dbt Labs from a project holding internal data
flags:
  send_anonymous_usage_stats: false

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Bronze is landed by `uv run ingest` before dbt runs. dbt starts at silver.
# Run dbt from this dbt/ folder (profiles.yml and relative paths assume it).

models:
  datawings:
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table

seeds:
  datawings:
    +schema: ref

# Source tests on bronze only warn: dirty source data is expected, and the failing counts are
# findings. Tests on silver and gold keep the default severity (error).
data_tests:
  datawings:
    bronze:
      +severity: warn

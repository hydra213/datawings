version: 2

models:
  - name: fct_duty
    description: One row per FLIGHT duty with its FDP limit and breach flags.
    columns:
      - name: duty_id
        data_tests: [not_null, unique]
      - name: fdp_rule_id
        description: Every flying duty must land in exactly one report-time band.
        data_tests: [not_null]
      - name: max_fdp_h
        data_tests: [not_null]
  - name: dim_crew
    description: Descriptive table for all crew members. Join with fct_duty on crew_id
    columns:
      - name: crew_id
        data_tests: [not_null, unique]
      - name: seniority_band
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['0-2 years', '2-5 years', '5-10 years', '10+ years']}
  - name: fct_crew_day
    description: >
      One row per crew member per calendar date (every date, incl. days with no duty), with
      rolling 7-day duty hours, 28-day block hours, days off, headroom and breach flags.
    columns:
      - name: crew_day_id
        description: crew_id|date. Unique = the spine has exactly one row per crew per day.
        data_tests: [not_null, unique]
      - name: crew_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_crew')
                field: crew_id
      - name: duty_7d_h
        data_tests: [not_null]
      - name: block_28d_h
        data_tests: [not_null]
  - name: fct_leg_qualification
    description: >
      One row per operated leg x required qualification, with validity derived from the
      qualification dates on the leg's local departure date (not the source status flag).
    columns:
      - name: leg_qual_id
        data_tests: [not_null, unique]
      - name: validity
        data_tests:
          - accepted_values:
              arguments: {values: ['VALID', 'EXPIRED', 'NOT_YET_ISSUED', 'MISSING']}
      - name: crew_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_crew')
                field: crew_id
  - name: dim_date
    description: One row per local date in the roster window. Conformed date dimension.
    columns:
      - name: date_day
        data_tests: [not_null, unique]
  - name: fct_flight
    description: >
      One row per flight leg (all statuses). Crew counts, legality, FDP and disruption rolled
      up to the flight.
    columns:
      - name: flight_key
        data_tests: [not_null, unique]
      - name: flight_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day

  # Board-shaped tables: pre-aggregated, carry fleet + crew_group so the app never joins.
  - name: fdp_breaches_by_band
    description: FDP breach counts per report band x fleet x crew group (board section 2).
    columns:
      - name: row_key
        description: rule|fleet|group. Unique = the grain is what we say it is.
        data_tests: [not_null, unique]
      - name: duties
        data_tests: [not_null]
  - name: qualification_lapses_by_crew
    description: One row per crew x qualification type flown without (board section 1).
    columns:
      - name: legs
        data_tests: [not_null]
  - name: crew_day_risk
    description: fct_crew_day + crew attributes + near-limit flag (board section 3).
    columns:
      - name: crew_day_id
        data_tests: [not_null, unique]

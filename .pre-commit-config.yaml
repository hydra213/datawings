repos:
     - repo: local
       hooks:
         - id: ruff
           name: ruff (python lint)
           entry: uv run ruff check --fix
           language: system
           types: [python]
         - id: ruff-format
           name: ruff (python format)
           entry: uv run ruff format
           language: system
           types: [python]
         - id: sqlfluff
           name: sqlfluff (sql lint)
           entry: uv run sqlfluff lint
           language: system
           files: ^dbt/models/.*\.sql$
version: 2

# Seeds = small reference data WE own and version in git (our decisions, not a source system's).
# Loaded into the `ref` schema.
seeds:
  - name: rank_map
    description: Maps every rank spelling seen in source to CAPT / FO / PURSER / CABIN. Add a row when a new variant appears.
    columns:
      - name: raw_rank
        data_tests: [not_null, unique]
      - name: clean_rank
        data_tests:
          - accepted_values:
              arguments:
                values: ["CAPT", "FO", "PURSER", "CABIN"]
  - name: qual_requirement
    description: >
      Which qualifications a crew member needs to operate a leg. Our own rule, inferred from
      who holds what (cabin: 4 types, flight crew: + RECENCY). per_aircraft = must match the
      leg's aircraft type.
    columns:
      - name: qual_type
        data_tests: [not_null, unique]
